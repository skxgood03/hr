<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 人事工资管理系统</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <style>
        /* 高端企业风格登录页面样式 */
        body {
            background: #0f1419;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* 动态背景装饰 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 219, 255, 0.2) 0%, transparent 50%);
            animation: backgroundShift 20s ease-in-out infinite;
            z-index: -2;
        }
        
        @keyframes backgroundShift {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }
        
        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(45deg, transparent 24%, rgba(255, 255, 255, 0.02) 25%, rgba(255, 255, 255, 0.02) 26%, transparent 27%, transparent 74%, rgba(255, 255, 255, 0.02) 75%, rgba(255, 255, 255, 0.02) 76%, transparent 77%),
                linear-gradient(-45deg, transparent 24%, rgba(255, 255, 255, 0.02) 25%, rgba(255, 255, 255, 0.02) 26%, transparent 27%, transparent 74%, rgba(255, 255, 255, 0.02) 75%, rgba(255, 255, 255, 0.02) 76%, transparent 77%);
            background-size: 60px 60px;
            z-index: -1;
            animation: patternMove 30s linear infinite;
        }
        
        @keyframes patternMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }
        
        /* 高端主登录卡片 */
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            box-shadow: 
                0 32px 64px rgba(0, 0, 0, 0.25),
                0 16px 32px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            padding: 3.5rem;
            width: 100%;
            max-width: 480px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            animation: cardFloat 6s ease-in-out infinite;
        }
        
        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            border-radius: 32px 32px 0 0;
        }
        
        .login-container::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(102, 126, 234, 0.1), transparent, rgba(118, 75, 162, 0.1), transparent);
            animation: rotate 20s linear infinite;
            z-index: -1;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 登录头部 */
        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        
        .login-header .fas {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            box-shadow: 
                0 16px 32px rgba(102, 126, 234, 0.3),
                0 8px 16px rgba(118, 75, 162, 0.2),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);
            color: white;
            line-height: 80px;
            font-size: 2.2rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            animation: logoGlow 4s ease-in-out infinite;
        }
        
        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 16px 32px rgba(102, 126, 234, 0.3), 0 8px 16px rgba(118, 75, 162, 0.2), inset 0 2px 4px rgba(255, 255, 255, 0.2); }
            50% { box-shadow: 0 20px 40px rgba(102, 126, 234, 0.4), 0 12px 24px rgba(118, 75, 162, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.3); }
        }
        
        .login-header .fas::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #667eea);
            border-radius: 26px;
            z-index: -1;
            animation: borderRotate 3s linear infinite;
        }
        
        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .login-header h1 {
            background: linear-gradient(135deg, #2c3e50 0%, #667eea 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.8rem;
            letter-spacing: -0.03em;
            text-align: center;
            position: relative;
        }
        
        .login-header h1::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }
        
        .login-header p {
            color: #6c757d;
            font-size: 1.1rem;
            margin-bottom: 0;
            font-weight: 500;
            text-align: center;
            opacity: 0.8;
        }
        
        /* 高端表单样式 */
        .form-floating {
            margin-bottom: 2rem;
            position: relative;
        }
        
        .form-floating::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
            border-radius: 18px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }
        
        .form-floating:focus-within::before {
            opacity: 1;
        }
        
        .form-floating label {
            color: #2c3e50;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        
        .form-control {
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
            font-size: 1.1rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            color: #2c3e50;
            position: relative;
            z-index: 1;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 
                0 0 0 4px rgba(102, 126, 234, 0.15),
                0 8px 25px rgba(102, 126, 234, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.95);
        }
        
        .form-control::placeholder {
            color: rgba(108, 117, 125, 0.7);
            font-size: 1rem;
            font-weight: 500;
        }
        
        /* 记住我选项 */
        .form-check {
            margin-bottom: 2rem;
            gap: 0.5rem;
        }
        
        .form-check-input {
            width: 18px;
            height: 18px;
            border: 2px solid #dee2e6;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .form-check-input:checked {
            background: #667eea;
            border-color: #667eea;
        }
        
        .form-check-label {
            color: #6c757d;
            font-size: 0.9rem;
            cursor: pointer;
            user-select: none;
        }
        
        /* 高端登录按钮 */
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            border: none;
            border-radius: 16px;
            padding: 1.3rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            width: 100%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 8px 25px rgba(102, 126, 234, 0.4),
                0 4px 12px rgba(118, 75, 162, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        
        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 35px rgba(102, 126, 234, 0.5),
                0 8px 20px rgba(118, 75, 162, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            color: white;
        }
        
        .btn-login:hover::before {
            left: 100%;
        }
        
        .btn-login:active {
            transform: translateY(-1px);
            transition: transform 0.1s ease;
        }
        
        .btn-login:disabled {
            opacity: 0.8;
            transform: none;
            box-shadow: none;
            pointer-events: none;
        }
        
        /* 消息提示 */
        .alert {
            border-radius: 12px;
            border: none;
            margin-bottom: 1.5rem;
        }
        
        .loading-spinner {
            display: none;
        }
        
        /* 加载状态 */
        .btn-login.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            margin: auto;
            border: 2px solid transparent;
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 高端系统信息 */
        .system-info {
            text-align: center;
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }
        
        .system-info::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            border-radius: 1px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .info-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .info-item i {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .info-item span {
            font-size: 0.8rem;
            color: #6c757d;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .system-info p {
            color: #adb5bd;
            font-size: 0.8rem;
            margin: 0.3rem 0;
            font-weight: 400;
        }
        
        .system-info .version {
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        /* 高端浮动装饰元素 */
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        
        .shape {
            position: absolute;
            border-radius: 50%;
            animation: advancedFloat 10s ease-in-out infinite;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .shape:nth-child(1) {
            width: 140px;
            height: 140px;
            top: 12%;
            left: 6%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15), rgba(120, 219, 255, 0.1));
            animation-delay: 0s;
        }
        
        .shape:nth-child(2) {
            width: 100px;
            height: 100px;
            top: 65%;
            right: 10%;
            background: linear-gradient(135deg, rgba(118, 75, 162, 0.15), rgba(240, 147, 251, 0.1));
            animation-delay: 3.5s;
        }
        
        .shape:nth-child(3) {
            width: 80px;
            height: 80px;
            bottom: 20%;
            left: 12%;
            background: linear-gradient(135deg, rgba(255, 119, 198, 0.15), rgba(102, 126, 234, 0.1));
            animation-delay: 7s;
        }
        
        .shape:nth-child(4) {
            width: 110px;
            height: 110px;
            top: 35%;
            right: 25%;
            background: linear-gradient(135deg, rgba(120, 219, 255, 0.15), rgba(118, 75, 162, 0.1));
            animation-delay: 1.5s;
        }
        
        @keyframes advancedFloat {
            0%, 100% {
                transform: translateY(0px) rotate(0deg) scale(1);
                opacity: 0.7;
            }
            25% {
                transform: translateY(-25px) rotate(90deg) scale(1.08);
                opacity: 0.9;
            }
            50% {
                transform: translateY(-40px) rotate(180deg) scale(1.15);
                opacity: 1;
            }
            75% {
                transform: translateY(-25px) rotate(270deg) scale(1.08);
                opacity: 0.9;
            }
        }
        
        /* 高端性能优化 */
        .login-container,
        .form-control,
        .btn-login,
        .shape {
            will-change: transform;
        }
        
        /* 高端无障碍支持 */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* 高端响应式设计 */
        @media (max-width: 768px) {
            .login-container {
                padding: 2.5rem 1.8rem;
                margin: 1rem;
                border-radius: 24px;
                max-width: none;
            }
            
            .login-header h1 {
                font-size: 1.8rem;
            }
            
            .login-header .fas {
                width: 70px;
                height: 70px;
                line-height: 70px;
                margin-bottom: 1.5rem;
                font-size: 2rem;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .shape:nth-child(3),
            .shape:nth-child(4) {
                opacity: 0.3;
            }
        }
        
        @media (max-width: 576px) {
            .login-container {
                margin: 0.5rem;
                padding: 2rem 1.2rem;
                border-radius: 20px;
            }
            
            .login-header h1 {
                font-size: 1.6rem;
            }
            
            .login-header p {
                font-size: 1rem;
            }
            
            .form-control {
                padding: 1rem 1.2rem;
                font-size: 1rem;
            }
            
            .btn-login {
                padding: 1.1rem 1.5rem;
                font-size: 1rem;
            }
            
            .shape {
                display: none;
            }
        }
        
        /* 高端深色模式支持 */
        @media (prefers-color-scheme: dark) {
            body {
                background: #0a0a0a;
            }
            
            .login-container {
                background: rgba(30, 30, 30, 0.95);
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 
                    0 32px 64px rgba(0, 0, 0, 0.4),
                    0 16px 32px rgba(0, 0, 0, 0.3),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
            }
            
            .login-header h1 {
                background: linear-gradient(135deg, #e9ecef 0%, #667eea 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
            }
            
            .login-header p,
            .form-floating label {
                color: #cbd5e0;
            }
            
            .form-control {
                background: rgba(50, 50, 50, 0.8);
                border-color: rgba(255, 255, 255, 0.1);
                color: #e9ecef;
            }
            
            .form-control:focus {
                background: rgba(60, 60, 60, 0.9);
                border-color: #667eea;
                color: #f8f9fa;
            }
            
            .form-control::placeholder {
                color: #a0aec0;
            }
            
            .info-item {
                background: rgba(255, 255, 255, 0.03);
                border-color: rgba(255, 255, 255, 0.05);
            }
            
            .info-item:hover {
                background: rgba(255, 255, 255, 0.08);
            }
            
            .system-info p {
                color: #9ca3af;
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="background-pattern"></div>
    
    <!-- 高端浮动装饰元素 -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <div class="login-container">
        <div class="login-header">
            <div class="company-logo">
                <i class="fas fa-crown"></i>
            </div>
            <h1>人事工资管理系统</h1>
                    <p>智能化人事工资管理平台 · 引领未来</p>
        </div>
        
        <!-- 错误消息显示 -->
        <div id="error-message" class="alert alert-danger" style="display: none;">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span id="error-text"></span>
        </div>
        
        <!-- 成功消息显示 -->
        <div id="success-message" class="alert alert-success" style="display: none;">
            <i class="fas fa-check-circle me-2"></i>
            <span id="success-text"></span>
        </div>
        
        <form id="loginForm">
            {% csrf_token %}
            
            <div class="form-floating">
                <input type="text" class="form-control" id="username" name="username" placeholder="用户名" required>
                <label for="username">
                    <i class="fas fa-user me-2"></i>用户名
                </label>
            </div>
            
            <div class="form-floating">
                <input type="password" class="form-control" id="password" name="password" placeholder="密码" required>
                <label for="password">
                    <i class="fas fa-lock me-2"></i>密码
                </label>
            </div>
            
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label" for="rememberMe">
                    记住我
                </label>
            </div>
            
            <button type="submit" class="btn btn-login" id="loginBtn">
                <span class="login-text">
                    <i class="fas fa-sign-in-alt me-2"></i>登录
                </span>
                <span class="loading-spinner">
                    <i class="fas fa-spinner fa-spin me-2"></i>登录中...
                </span>
            </button>
        </form>
        
        <div class="system-info">
            <div class="info-grid">
                <div class="info-item">
                    <i class="fas fa-shield-alt"></i>
                    <span>企业级安全</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-cloud"></i>
                    <span>云端同步</span>
                </div>
                <div class="info-item">
                    <i class="fas fa-chart-line"></i>
                    <span>智能分析</span>
                </div>
            </div>
            <p class="version"><strong>HRPMS</strong> Enterprise v2.0.1</p>
            <p><span id="current-time"></span></p>
            <p>© 2024 人事工资管理系统 · 专业版. 保留所有权利.</p>
        </div>
    </div>
    
    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token }}">
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // 更新系统时间
            function updateTime() {
                const now = new Date();
                const timeString = now.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                $('#current-time').text(timeString);
            }
            
            // 每秒更新时间
            updateTime();
            setInterval(updateTime, 1000);
            
            // 显示错误消息
            function showError(message) {
                $('#error-text').text(message);
                $('#error-message').slideDown();
                $('#success-message').slideUp();
            }
            
            // 显示成功消息
            function showSuccess(message) {
                $('#success-text').text(message);
                $('#success-message').slideDown();
                $('#error-message').slideUp();
            }
            
            // 隐藏所有消息
            function hideMessages() {
                $('#error-message').slideUp();
                $('#success-message').slideUp();
            }
            
            // 设置按钮加载状态
            function setLoading(loading) {
                const $btn = $('#loginBtn');
                const $loginText = $('.login-text');
                const $loadingSpinner = $('.loading-spinner');
                
                if (loading) {
                    $btn.prop('disabled', true);
                    $loginText.hide();
                    $loadingSpinner.show();
                } else {
                    $btn.prop('disabled', false);
                    $loginText.show();
                    $loadingSpinner.hide();
                }
            }
            
            // 表单提交处理
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();
                
                const username = $('#username').val().trim();
                const password = $('#password').val().trim();
                
                // 基本验证
                if (!username) {
                    showError('请输入用户名');
                    $('#username').focus();
                    return;
                }
                
                if (!password) {
                    showError('请输入密码');
                    $('#password').focus();
                    return;
                }
                
                // 隐藏消息并设置加载状态
                hideMessages();
                setLoading(true);
                
                // 发送登录请求
                $.ajax({
                    url: '/login/',
                    type: 'POST',
                    headers: {
                        'X-CSRFToken': $('meta[name=csrf-token]').attr('content'),
                        'Content-Type': 'application/json'
                    },
                    data: JSON.stringify({
                        username: username,
                        password: password
                    }),
                    success: function(response) {
                        setLoading(false);
                        
                        if (response.code === 2000) {
                            showSuccess('登录成功，正在跳转...');
                            
                            // 使用后端返回的重定向URL
                            const redirectUrl = response.data && response.data.redirect_url ? response.data.redirect_url : '/';
                            setTimeout(function() {
                                window.location.href = redirectUrl;
                            }, 1500);
                        } else {
                            showError(response.msg || '登录失败');
                        }
                    },
                    error: function(xhr, status, error) {
                        setLoading(false);
                        
                        if (xhr.responseJSON && xhr.responseJSON.msg) {
                            showError(xhr.responseJSON.msg);
                        } else {
                            showError('网络错误，请检查网络连接');
                        }
                    }
                });
            });
            
            // 输入框焦点效果
            $('.form-control').on('focus', function() {
                hideMessages();
            });
            
            // 回车键提交
            $('.form-control').on('keypress', function(e) {
                if (e.which === 13) {
                    $('#loginForm').submit();
                }
            });
            
            // 高端用户体验优化
            // 自动聚焦到用户名输入框
            setTimeout(function() {
                $('#username').focus();
            }, 500);
            
            // 记住我功能
            if (localStorage.getItem('rememberMe') === 'true') {
                $('#rememberMe').prop('checked', true);
                const savedUsername = localStorage.getItem('savedUsername');
                if (savedUsername) {
                    $('#username').val(savedUsername);
                    $('#password').focus();
                }
            }
            
            // 保存记住我状态
            $('#rememberMe').on('change', function() {
                if ($(this).is(':checked')) {
                    localStorage.setItem('rememberMe', 'true');
                } else {
                    localStorage.removeItem('rememberMe');
                    localStorage.removeItem('savedUsername');
                }
            });
            
            // 登录成功后保存用户名
            $('#loginForm').on('submit', function() {
                if ($('#rememberMe').is(':checked')) {
                    localStorage.setItem('savedUsername', $('#username').val());
                }
            });
        });
    </script>
</body>
</html>
