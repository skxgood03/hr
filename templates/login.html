<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 人力资源管理系统</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .login-header h1 {
            color: #333;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .login-header p {
            color: #666;
            margin-bottom: 0;
        }
        
        .form-floating {
            margin-bottom: 1.5rem;
        }
        
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            color: white;
        }
        
        .btn-login:disabled {
            opacity: 0.7;
            transform: none;
            box-shadow: none;
        }
        
        .alert {
            border-radius: 12px;
            border: none;
            margin-bottom: 1.5rem;
        }
        
        .loading-spinner {
            display: none;
        }
        
        .system-info {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e9ecef;
        }
        
        .system-info p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }
        
        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }
        
        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }
        
        @media (max-width: 576px) {
            .login-container {
                margin: 1rem;
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 浮动装饰元素 -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-building fa-3x text-primary mb-3"></i>
            <h1>欢迎登录</h1>
            <p>人力资源管理系统</p>
        </div>
        
        <!-- 错误消息显示 -->
        <div id="error-message" class="alert alert-danger" style="display: none;">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span id="error-text"></span>
        </div>
        
        <!-- 成功消息显示 -->
        <div id="success-message" class="alert alert-success" style="display: none;">
            <i class="fas fa-check-circle me-2"></i>
            <span id="success-text"></span>
        </div>
        
        <form id="loginForm">
            {% csrf_token %}
            
            <div class="form-floating">
                <input type="text" class="form-control" id="username" name="username" placeholder="用户名" required>
                <label for="username">
                    <i class="fas fa-user me-2"></i>用户名
                </label>
            </div>
            
            <div class="form-floating">
                <input type="password" class="form-control" id="password" name="password" placeholder="密码" required>
                <label for="password">
                    <i class="fas fa-lock me-2"></i>密码
                </label>
            </div>
            
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label" for="rememberMe">
                    记住我
                </label>
            </div>
            
            <button type="submit" class="btn btn-login" id="loginBtn">
                <span class="login-text">
                    <i class="fas fa-sign-in-alt me-2"></i>登录
                </span>
                <span class="loading-spinner">
                    <i class="fas fa-spinner fa-spin me-2"></i>登录中...
                </span>
            </button>
        </form>
        
        <div class="system-info">
            <p><i class="fas fa-shield-alt me-2"></i>安全登录</p>
            <p><i class="fas fa-clock me-2"></i>系统时间: <span id="current-time"></span></p>
        </div>
    </div>
    
    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token }}">
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        $(document).ready(function() {
            // 更新系统时间
            function updateTime() {
                const now = new Date();
                const timeString = now.toLocaleString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                $('#current-time').text(timeString);
            }
            
            // 每秒更新时间
            updateTime();
            setInterval(updateTime, 1000);
            
            // 显示错误消息
            function showError(message) {
                $('#error-text').text(message);
                $('#error-message').slideDown();
                $('#success-message').slideUp();
            }
            
            // 显示成功消息
            function showSuccess(message) {
                $('#success-text').text(message);
                $('#success-message').slideDown();
                $('#error-message').slideUp();
            }
            
            // 隐藏所有消息
            function hideMessages() {
                $('#error-message').slideUp();
                $('#success-message').slideUp();
            }
            
            // 设置按钮加载状态
            function setLoading(loading) {
                const $btn = $('#loginBtn');
                const $loginText = $('.login-text');
                const $loadingSpinner = $('.loading-spinner');
                
                if (loading) {
                    $btn.prop('disabled', true);
                    $loginText.hide();
                    $loadingSpinner.show();
                } else {
                    $btn.prop('disabled', false);
                    $loginText.show();
                    $loadingSpinner.hide();
                }
            }
            
            // 表单提交处理
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();
                
                const username = $('#username').val().trim();
                const password = $('#password').val().trim();
                
                // 基本验证
                if (!username) {
                    showError('请输入用户名');
                    $('#username').focus();
                    return;
                }
                
                if (!password) {
                    showError('请输入密码');
                    $('#password').focus();
                    return;
                }
                
                // 隐藏消息并设置加载状态
                hideMessages();
                setLoading(true);
                
                // 发送登录请求
                $.ajax({
                    url: '/login/',
                    type: 'POST',
                    headers: {
                        'X-CSRFToken': $('meta[name=csrf-token]').attr('content'),
                        'Content-Type': 'application/json'
                    },
                    data: JSON.stringify({
                        username: username,
                        password: password
                    }),
                    success: function(response) {
                        setLoading(false);
                        
                        if (response.code === 2000) {
                            showSuccess('登录成功，正在跳转...');
                            
                            // 使用后端返回的重定向URL
                            const redirectUrl = response.data && response.data.redirect_url ? response.data.redirect_url : '/';
                            setTimeout(function() {
                                window.location.href = redirectUrl;
                            }, 1500);
                        } else {
                            showError(response.msg || '登录失败');
                        }
                    },
                    error: function(xhr, status, error) {
                        setLoading(false);
                        
                        if (xhr.responseJSON && xhr.responseJSON.msg) {
                            showError(xhr.responseJSON.msg);
                        } else {
                            showError('网络错误，请检查网络连接');
                        }
                    }
                });
            });
            
            // 输入框焦点效果
            $('.form-control').on('focus', function() {
                hideMessages();
            });
            
            // 回车键提交
            $('.form-control').on('keypress', function(e) {
                if (e.which === 13) {
                    $('#loginForm').submit();
                }
            });
        });
    </script>
</body>
</html>
